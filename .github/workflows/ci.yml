name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore EveCommandCenter.sln

      - name: Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/diagnostics | Out-Null
          dotnet build EveCommandCenter.sln --configuration Release --no-restore 2>&1 | Tee-Object -FilePath artifacts/diagnostics/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: artifacts/diagnostics/build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Test
        run: dotnet test EveCommandCenter.sln --configuration Release --no-build --collect:"XPlat Code Coverage"

      - name: Publish Windows test build
        run: dotnet publish src/EveCommandCenter.App/EveCommandCenter.App.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/EVE-Command-Center

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: EVE-Command-Center-win-x64
          path: artifacts/EVE-Command-Center
          if-no-files-found: error

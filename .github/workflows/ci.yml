name: CI

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore EveCommandCenter.sln

      - name: Build
        run: dotnet build EveCommandCenter.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EveCommandCenter.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
